# Literal KEY=value pairs. Spaces in values are literal. Do not add quotes.
# Account that owns Moonlight settings. Empty uses the non-root sudo caller.
APPLIANCE_USER=

# Leave host empty to launch the GUI for discovery and first-time PIN pairing.
# After pairing as APPLIANCE_USER, set the host and rerun install for auto-stream.
SUNSHINE_HOST=
SUNSHINE_APP=Desktop
BITRATE_KBPS=50000

# Optional iperf3 server on your Sunshine PC or another wired LAN machine.
BENCHMARK_HOST=
BENCHMARK_SECONDS=20
